name: Build VPS image

on:
  workflow_dispatch:
  # Images are built only from main commits whose CI run passed.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: duoshot-container-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      IMAGE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.IMAGE_SHA }}
      - name: Validate public build configuration
        shell: bash
        run: |
          test -n "$NEXT_PUBLIC_SITE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
      - name: Image identity
        id: image
        shell: bash
        run: echo "tag=ghcr.io/${GITHUB_REPOSITORY,,}:${IMAGE_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          outputs: type=docker,dest=${{ runner.temp }}/duoshot.tar
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v4
        with:
          name: duoshot-image-${{ env.IMAGE_SHA }}
          path: ${{ runner.temp }}/duoshot.tar
          compression-level: 1
          retention-days: 1
