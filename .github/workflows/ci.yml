name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx cypress install
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      - uses: cypress-io/github-action@v6
        with:
          install: false
          start: npm start
          wait-on: http://127.0.0.1:3000
          wait-on-timeout: 120
          browser: chrome
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
