# Layer over the official self-hosted/v0.8.2 docker-compose.yml.
# Private preparation stack: expose through HTTPS only after migration checks.
name: duoshot-supabase
services:
  studio:
    profiles: [admin]
    mem_limit: 384m
  meta:
    profiles: [admin]
    mem_limit: 192m
  realtime:
    profiles: [unused]
  functions:
    profiles: [unused]
  imgproxy:
    profiles: [unused]
  supavisor:
    profiles: [unused]
    ports: !reset []
  api-gw:
    depends_on: !override
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
      storage:
        condition: service_healthy
    ports: !override
      - 127.0.0.1:8000:8000
    command: [--concurrency, '2']
    mem_limit: 128m
  auth:
    mem_limit: 192m
    environment:
      GOTRUE_DB_MAX_POOL_SIZE: '10'
  rest:
    mem_limit: 128m
    environment:
      PGRST_DB_POOL: '10'
  storage:
    depends_on: !override
      db:
        condition: service_healthy
      rest:
        condition: service_healthy
    mem_limit: 384m
    environment:
      FILE_SIZE_LIMIT: '104857600'
      ENABLE_IMAGE_TRANSFORMATION: 'false'
      NODE_OPTIONS: --max-old-space-size=256
  db:
    mem_limit: 768m
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=warning
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=80
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
